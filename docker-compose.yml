# AI Hub — self-hosted service stack
#
# Runs the always-on pieces of the hub. Designed to be:
#   • run directly:   docker compose up -d
#   • imported by Coolify as a resource (each service becomes a supervised tile)
#
# Secrets come from a git-ignored .env (see .env.example for the variable NAMES).
# Never hard-code credentials in this file.
#
# In Coolify: map the volumes below to "Persistent Storage" so data and the
# shared /workspace survive redeploys, and keep the exposed ports behind
# Tailscale / an SSH tunnel — do not publish them naked (see SETUP.md §Security).

name: ai-hub

services:
  # ── Browser IDE + terminal: where you sit and drive Claude Code ────────────
  code-server:
    image: codercom/code-server:latest
    container_name: ai-hub-code-server
    restart: unless-stopped
    environment:
      # Password auth for the IDE. Set PASSWORD in .env (or Coolify env).
      PASSWORD: ${CODE_SERVER_PASSWORD:?set CODE_SERVER_PASSWORD in .env}
    volumes:
      - ./workspace:/home/coder/workspace          # shared filesystem
      - code-server-config:/home/coder/.config     # IDE settings persist
    ports:
      # Bind to loopback only; reach it via SSH tunnel / Tailscale, or let
      # Coolify's reverse proxy terminate TLS in front of it.
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgres

  # ── Shared brain: Postgres with pgvector for memory / embeddings ───────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aihub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aihub}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aihub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── n8n: automation backbone (webhooks, schedules, agent triggers) ─────────
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: ai-hub-n8n
    restart: unless-stopped
    environment:
      # Encrypts stored credentials — set a long random value in .env / Coolify.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      # Public URL n8n builds webhook links from (reach it via Tailscale/proxy).
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TZ:-UTC}
    volumes:
      - n8n-data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"

  # ── Homepage: YAML-configured service dashboard (config lives in ./homepage)─
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: ai-hub-homepage
    restart: unless-stopped
    environment:
      # Recent Homepage requires an allow-list of hosts it will serve.
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-localhost:3001}
    volumes:
      - ./homepage:/app/config
      # Optional: read-only Docker socket enables auto-discovery widgets.
      # Security trade-off — exposes container metadata to Homepage. Enable only
      # if you want the Docker widgets:
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:3001:3000"

  # ── Restic: scheduled, encrypted, off-site backups of the hub's volumes ────
  # Backs up the Postgres brain + shared workspace to an off-site repo
  # (Backblaze B2 / S3) on a cron schedule. RESTIC_* secrets come from .env.
  restic-backup:
    image: mazzolino/restic:latest
    container_name: ai-hub-restic
    restart: unless-stopped
    hostname: ai-hub
    environment:
      RUN_ON_STARTUP: "false"
      BACKUP_CRON: ${RESTIC_BACKUP_CRON:-0 3 * * *}      # daily at 03:00
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?set RESTIC_REPOSITORY in .env}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?set RESTIC_PASSWORD in .env}
      # Provider creds (e.g. Backblaze B2 / S3) — set the ones your repo needs:
      AWS_ACCESS_KEY_ID: ${RESTIC_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${RESTIC_AWS_SECRET_ACCESS_KEY:-}
      B2_ACCOUNT_ID: ${RESTIC_B2_ACCOUNT_ID:-}
      B2_ACCOUNT_KEY: ${RESTIC_B2_ACCOUNT_KEY:-}
      RESTIC_BACKUP_SOURCES: /data
      RESTIC_FORGET_ARGS: --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune
    volumes:
      - postgres-data:/data/postgres:ro
      - ./workspace:/data/workspace:ro
      - restic-cache:/root/.cache/restic

  # ── Memory MCP server (optional, remote/HTTP flavor) ───────────────────────
  # Most MCP connectors run per-session over stdio via .mcp.json (see D-0003).
  # This service is here for a *shared, always-on* memory endpoint that multiple
  # AI clients (not just Claude Code) can reach. Swap the image for your chosen
  # memory server (e.g. a Mem0 self-host) and expose its port to the hub network.
  # Left commented until a concrete remote memory server is selected.
  #
  # memory-mcp:
  #   image: <your-memory-mcp-image>
  #   container_name: ai-hub-memory-mcp
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: postgres://${POSTGRES_USER:-aihub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aihub}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   ports:
  #     - "127.0.0.1:9100:9100"

  # ── Hermes (local LLM) via Ollama — GPU-CONDITIONAL, disabled by default ───
  # A private, no-API-cost model alongside Claude. Uncomment ONLY if the host
  # has a GPU (CPU inference is too slow to be useful). After first boot:
  #   docker exec -it ai-hub-ollama ollama pull hermes3
  # Then point clients at http://ollama:11434 (OpenAI-compatible endpoint).
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ai-hub-ollama
  #   restart: unless-stopped
  #   volumes:
  #     - ollama-models:/root/.ollama
  #   ports:
  #     - "127.0.0.1:11434:11434"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

  # ── Hub app: Next.js dashboard / API surface (built from ./app) ────────────
  # Coolify can auto-redeploy this from Git on push.
  hub-app:
    build: ./app
    container_name: ai-hub-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-aihub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aihub}
      # Service links shown on the dashboard — override with Tailscale hostnames.
      SVC_COOLIFY_URL: ${SVC_COOLIFY_URL:-http://localhost:8000}
      SVC_CODE_SERVER_URL: ${SVC_CODE_SERVER_URL:-http://localhost:8080}
      SVC_N8N_URL: ${SVC_N8N_URL:-http://localhost:5678}
      SVC_HOMEPAGE_URL: ${SVC_HOMEPAGE_URL:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  code-server-config:
  n8n-data:
  restic-cache:
  # ollama-models:   # uncomment together with the ollama service (GPU only)
